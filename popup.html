<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SafifyNote</title>
<link rel="icon" type="image/png" href="icons/icon32.png" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/popup.css" />
</head>
<body data-theme="light">
  <div class="pop">
    <header class="pop-head">
      <div class="brand">
        <img src="icons/logo.png" alt="SafifyNote" class="brand-logo" />
        <span class="brand-name">SafifyNote</span>
      </div>
      <div class="head-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle dark mode">
          <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="importBtn" class="icon-btn" title="Import .sff file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button id="privateVaultBtn" class="icon-btn" title="Open Private Vault">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
        <input type="file" id="importInput" accept=".sff" hidden />
      </div>
    </header>

    <div class="pop-toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search notes…" />
      </div>
      <button id="newNoteBtn" class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New note
      </button>
    </div>

    <main id="notesList" class="notes-list"></main>

    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-glyph">✦</div>
      <p>No notes yet</p>
      <span>Create your first notebook to get started</span>
    </div>
  </div>

  <!-- context menu for a note card -->
  <div id="cardMenu" class="card-menu" hidden>
    <button data-action="open">Open</button>
    <button data-action="pdf">Download PDF</button>
    <button data-action="png">Download PNG</button>
    <button data-action="jpg">Download JPG</button>
    <button data-action="sff">Export .sff</button>
    <button data-action="delete" class="danger">Delete</button>
  </div>

  <script src="js/common.js"></script>
  <script src="js/export.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
